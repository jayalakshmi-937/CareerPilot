# ==============================================================================
# CareerPilot: Docker Compose Orchestration
# Services:
#   1. backend  - FastAPI REST API + LangGraph multi-agent loop (port 8000)
#   2. frontend - Streamlit candidate preparation UI (port 8501)
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot-backend
    restart: unless-stopped
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data_storage/careerpilot.db
      - CHROMA_PERSIST_DIR=/app/data_storage/chroma_db
    volumes:
      - careerpilot_storage:/app/data_storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - careerpilot_storage:/app/data_storage

volumes:
  careerpilot_storage:
    name: careerpilot_data_storage
